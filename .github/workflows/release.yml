name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          FLC_VERSION: ${{ github.ref_name }}
        run: |
          VER=${FLC_VERSION#v}
          MIHOMO=$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -tags with_gvisor \
            -ldflags "-s -w -buildid= -X main.version=$VER -X github.com/metacubex/mihomo/constant.Version=$MIHOMO" \
            -o dist/flc ./src

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*